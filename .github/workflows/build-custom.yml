name: Build Custom RustDesk Client

on:
  workflow_dispatch:
    inputs:
      client_key:
        description: 'Client key for authentication'
        required: true
        type: string
      api_server:
        description: 'API server URL'
        required: false
        type: string
        default: ''
      relay_server:
        description: 'Relay server URL'
        required: false
        type: string
        default: ''
      rendezvous_server:
        description: 'Rendezvous server hostname'
        required: true
        type: string
      build_platform:
        description: 'Target platform'
        required: true
        type: choice
        options:
          - windows
          - linux
          - macos
          - all
        default: 'all'

  push:
    branches: [ custom-base ]
    paths:
      - '.github/workflows/build-custom.yml'
      - 'build_custom.rs'
      - 'custom_config_template.rs'

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        exclude:
          - os: windows-latest
            platform: linux
          - os: ubuntu-latest
            platform: windows
          - os: macos-latest
            platform: windows
          - os: windows-latest
            platform: macos
          - os: ubuntu-latest
            platform: macos
          - os: macos-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    env:
      CUSTOM_CLIENT_KEY: ${{ github.event.inputs.client_key || secrets.CUSTOM_CLIENT_KEY || '' }}
      CUSTOM_API_SERVER: ${{ github.event.inputs.api_server || secrets.CUSTOM_API_SERVER || '' }}
      CUSTOM_RELAY_SERVER: ${{ github.event.inputs.relay_server || secrets.CUSTOM_RELAY_SERVER || '' }}
      CUSTOM_RENDEZVOUS_SERVER: ${{ github.event.inputs.rendezvous_server || secrets.CUSTOM_RENDEZVOUS_SERVER || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          vcpkg\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Setup vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=$PWD/vcpkg
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          $VCPKG_ROOT/vcpkg install libvpx libyuv opus aom

      - name: Setup Flutter (for Flutter builds)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.x'
          channel: 'stable'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip g++ gcc git curl wget nasm yasm libgtk-3-dev clang \
            libxcb-randr0-dev libxdo-dev libxfixes-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libasound2-dev libpulse-dev cmake make \
            libclang-dev ninja-build libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libpam0g-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm yasm

      - name: Verify Configuration
        run: |
          echo "=== Configuration Verification ==="
          echo "Client Key: ${{ env.CUSTOM_CLIENT_KEY != '' && '***' || 'Not set' }}"
          echo "API Server: ${{ env.CUSTOM_API_SERVER || 'Not set' }}"
          echo "Relay Server: ${{ env.CUSTOM_RELAY_SERVER || 'Not set' }}"
          echo "Rendezvous Server: ${{ env.CUSTOM_RENDEZVOUS_SERVER || 'Not set' }}"
          echo "=================================="

      - name: Build Rust Core (Desktop)
        if: github.event.inputs.build_platform != 'flutter-only'
        run: |
          export VCPKG_ROOT=$VCPKG_ROOT
          export CUSTOM_CLIENT_KEY="${{ env.CUSTOM_CLIENT_KEY }}"
          export CUSTOM_API_SERVER="${{ env.CUSTOM_API_SERVER }}"
          export CUSTOM_RELAY_SERVER="${{ env.CUSTOM_RELAY_SERVER }}"
          export CUSTOM_RENDEZVOUS_SERVER="${{ env.CUSTOM_RENDEZVOUS_SERVER }}"

          # Build with custom configuration
          cargo build --release --features flutter

          # Verify binary was created
          if [ -f "target/release/rustdesk" ] || [ -f "target/release/rustdesk.exe" ]; then
            echo "✅ Build successful"
          else
            echo "❌ Build failed"
            exit 1
          fi

      - name: Build Flutter UI
        if: github.event.inputs.build_platform != 'rust-only'
        run: |
          cd flutter
          flutter pub get

          # Build for current platform
          if [ "${{ runner.os }}" == "Windows" ]; then
            flutter build windows --release
          elif [ "${{ runner.os }}" == "macOS" ]; then
            flutter build macos --release
          else
            flutter build linux --release
          fi

      - name: Package Artifacts
        run: |
          mkdir -p artifacts

          # Package Rust binary
          if [ -f "target/release/rustdesk.exe" ]; then
            cp target/release/rustdesk.exe artifacts/
            cp target/release/rustdesk.exe artifacts/rustdesk-custom-${{ env.CUSTOM_RENDEZVOUS_SERVER }}.exe
          elif [ -f "target/release/rustdesk" ]; then
            cp target/release/rustdesk artifacts/
            cp target/release/rustdesk artifacts/rustdesk-custom-${{ env.CUSTOM_RENDEZVOUS_SERVER }}
          fi

          # Package Flutter app
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp -r flutter/build/windows/x64/runner/Release/* artifacts/ 2>/dev/null || true
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp -r flutter/build/macos/Build/Products/Release/*.app artifacts/ 2>/dev/null || true
          else
            cp -r flutter/build/linux/x64/release/bundle/* artifacts/ 2>/dev/null || true
          fi

          # Create config info file
          cat > artifacts/custom-config-info.txt << EOF
          Custom Server Configuration
          ==========================
          Generated: $(date)
          Rendezvous Server: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}
          API Server: ${{ env.CUSTOM_API_SERVER || 'Default' }}
          Relay Server: ${{ env.CUSTOM_RELAY_SERVER || 'Default' }}
          Client Key: ${{ env.CUSTOM_CLIENT_KEY != '' && 'Configured' || 'Not set' }}
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-${{ env.CUSTOM_RENDEZVOUS_SERVER }}-${{ runner.os }}
          path: artifacts/
          retention-days: 30

      - name: Create Release (Optional)
        if: github.event.inputs.build_platform == 'all'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: custom-${{ env.CUSTOM_RENDEZVOUS_SERVER }}-${{ github.run_number }}
          name: Custom Build - ${{ env.CUSTOM_RENDEZVOUS_SERVER }}
          body: |
            Custom RustDesk build for server: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}

            **Configuration:**
            - Rendezvous: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}
            - API: ${{ env.CUSTOM_API_SERVER || 'Default' }}
            - Relay: ${{ env.CUSTOM_RELAY_SERVER || 'Default' }}

            Generated via GitHub Actions
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}