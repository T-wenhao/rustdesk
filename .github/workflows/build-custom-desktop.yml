name: Build Custom Desktop Client

on:
  workflow_dispatch:
    inputs:
      client_key:
        description: 'Client authentication key'
        required: true
        type: string
      api_server:
        description: 'API server URL (e.g., https://api.example.com)'
        required: false
        type: string
        default: ''
      relay_server:
        description: 'Relay server URL (e.g., https://relay.example.com)'
        required: false
        type: string
        default: ''
      rendezvous_server:
        description: 'Rendezvous server hostname (e.g., example.com)'
        required: true
        type: string
      build_platform:
        description: 'Target platform to build'
        required: true
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
        default: 'all'

  push:
    branches: [ custom-base ]
    paths:
      - '.github/workflows/build-custom-desktop.yml'
      - 'build.rs'
      - 'build.py'

env:
  # Use latest stable Rust for all platforms
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VERSION: "1.4.4"

jobs:
  # Windows Build Job
  build-windows:
    runs-on: windows-2022
    if: github.event.inputs.build_platform == 'all' || github.event.inputs.build_platform == 'windows'

    env:
      CUSTOM_CLIENT_KEY: ${{ github.event.inputs.client_key || secrets.CUSTOM_CLIENT_KEY || '' }}
      CUSTOM_API_SERVER: ${{ github.event.inputs.api_server || secrets.CUSTOM_API_SERVER || '' }}
      CUSTOM_RELAY_SERVER: ${{ github.event.inputs.relay_server || secrets.CUSTOM_RELAY_SERVER || '' }}
      CUSTOM_RENDEZVOUS_SERVER: ${{ github.event.inputs.rendezvous_server || secrets.CUSTOM_RENDEZVOUS_SERVER || '' }}
      VCPKG_ROOT: C:\vcpkg

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          .\vcpkg\bootstrap-vcpkg.bat
          echo "VCPKG_ROOT=$env:VCPKG_ROOT" >> $env:GITHUB_ENV
          vcpkg\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Verify Configuration
        run: |
          echo "=== Custom Configuration ==="
          echo "Rendezvous: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}"
          echo "API Server: ${{ env.CUSTOM_API_SERVER || 'Default' }}"
          echo "Relay Server: ${{ env.CUSTOM_RELAY_SERVER || 'Default' }}"
          echo "Client Key: ${{ env.CUSTOM_CLIENT_KEY != '' && '***' || 'Not set' }}"
          echo "============================"

      - name: Build RustDesk
        run: |
          # Set environment variables for build.py
          $env:CUSTOM_CLIENT_KEY = "${{ env.CUSTOM_CLIENT_KEY }}"
          $env:CUSTOM_API_SERVER = "${{ env.CUSTOM_API_SERVER }}"
          $env:CUSTOM_RELAY_SERVER = "${{ env.CUSTOM_RELAY_SERVER }}"
          $env:CUSTOM_RENDEZVOUS_SERVER = "${{ env.CUSTOM_RENDEZVOUS_SERVER }}"

          # Build with Flutter
          python3 build.py --flutter --release --skip-portable-pack

      - name: Package Artifacts
        run: |
          New-Item -ItemType Directory -Force -Path artifacts

          # Copy Flutter build output
          if (Test-Path "flutter/build/windows/x64/runner/Release") {
            Copy-Item "flutter/build/windows/x64/runner/Release/*" -Destination "artifacts/" -Recurse
          }

          # Create config info
          @"
          Custom Server Configuration
          =========================
          Generated: $(Get-Date)
          Platform: Windows x64
          Rendezvous Server: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}
          API Server: ${{ env.CUSTOM_API_SERVER || 'Default' }}
          Relay Server: ${{ env.CUSTOM_RELAY_SERVER || 'Default' }}
          Client Key: ${{ env.CUSTOM_CLIENT_KEY != '' && 'Configured' || 'Not set' }}
          "@ | Out-File -FilePath "artifacts/config-info.txt" -Encoding UTF8

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-windows-x64
          path: artifacts/
          retention-days: 30

  # Linux Build Job
  build-linux:
    runs-on: ubuntu-22.04
    if: github.event.inputs.build_platform == 'all' || github.event.inputs.build_platform == 'linux'

    env:
      CUSTOM_CLIENT_KEY: ${{ github.event.inputs.client_key || secrets.CUSTOM_CLIENT_KEY || '' }}
      CUSTOM_API_SERVER: ${{ github.event.inputs.api_server || secrets.CUSTOM_API_SERVER || '' }}
      CUSTOM_RELAY_SERVER: ${{ github.event.inputs.relay_server || secrets.CUSTOM_RELAY_SERVER || '' }}
      CUSTOM_RENDEZVOUS_SERVER: ${{ github.event.inputs.rendezvous_server || secrets.CUSTOM_RENDEZVOUS_SERVER || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=$PWD/vcpkg
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          $VCPKG_ROOT/vcpkg install libvpx libyuv opus aom

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zip g++ gcc git curl wget nasm yasm libgtk-3-dev clang \
            libxcb-randr0-dev libxdo-dev libxfixes-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libasound2-dev libpulse-dev cmake make \
            libclang-dev ninja-build libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libpam0g-dev

      - name: Verify Configuration
        run: |
          echo "=== Custom Configuration ==="
          echo "Rendezvous: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}"
          echo "API Server: ${{ env.CUSTOM_API_SERVER || 'Default' }}"
          echo "Relay Server: ${{ env.CUSTOM_RELAY_SERVER || 'Default' }}"
          echo "Client Key: ${{ env.CUSTOM_CLIENT_KEY != '' && '***' || 'Not set' }}"
          echo "============================"

      - name: Build RustDesk
        run: |
          export VCPKG_ROOT=$VCPKG_ROOT
          export CUSTOM_CLIENT_KEY="${{ env.CUSTOM_CLIENT_KEY }}"
          export CUSTOM_API_SERVER="${{ env.CUSTOM_API_SERVER }}"
          export CUSTOM_RELAY_SERVER="${{ env.CUSTOM_RELAY_SERVER }}"
          export CUSTOM_RENDEZVOUS_SERVER="${{ env.CUSTOM_RENDEZVOUS_SERVER }}"

          python3 build.py --flutter --release

      - name: Package Artifacts
        run: |
          mkdir -p artifacts

          # Copy Flutter build output
          if [ -d "flutter/build/linux/x64/release/bundle" ]; then
            cp -r flutter/build/linux/x64/release/bundle/* artifacts/
          fi

          # Copy deb package if exists
          if [ -f "rustdesk-${{ env.VERSION }}_amd64.deb" ]; then
            cp rustdesk-${{ env.VERSION }}_amd64.deb artifacts/
          fi

          # Create config info
          cat > artifacts/config-info.txt << EOF
          Custom Server Configuration
          =========================
          Generated: $(date)
          Platform: Linux x64
          Rendezvous Server: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}
          API Server: ${{ env.CUSTOM_API_SERVER || 'Default' }}
          Relay Server: ${{ env.CUSTOM_RELAY_SERVER || 'Default' }}
          Client Key: ${{ env.CUSTOM_CLIENT_KEY != '' && 'Configured' || 'Not set' }}
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-linux-x64
          path: artifacts/
          retention-days: 30

  # macOS Build Job
  build-macos:
    runs-on: macos-14
    if: github.event.inputs.build_platform == 'all' || github.event.inputs.build_platform == 'macos'

    env:
      CUSTOM_CLIENT_KEY: ${{ github.event.inputs.client_key || secrets.CUSTOM_CLIENT_KEY || '' }}
      CUSTOM_API_SERVER: ${{ github.event.inputs.api_server || secrets.CUSTOM_API_SERVER || '' }}
      CUSTOM_RELAY_SERVER: ${{ github.event.inputs.relay_server || secrets.CUSTOM_RELAY_SERVER || '' }}
      CUSTOM_RENDEZVOUS_SERVER: ${{ github.event.inputs.rendezvous_server || secrets.CUSTOM_RENDEZVOUS_SERVER || '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg
          ./vcpkg/bootstrap-vcpkg.sh
          export VCPKG_ROOT=$PWD/vcpkg
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          $VCPKG_ROOT/vcpkg install libvpx libyuv opus aom

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install System Dependencies
        run: |
          brew install nasm yasm

      - name: Verify Configuration
        run: |
          echo "=== Custom Configuration ==="
          echo "Rendezvous: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}"
          echo "API Server: ${{ env.CUSTOM_API_SERVER || 'Default' }}"
          echo "Relay Server: ${{ env.CUSTOM_RELAY_SERVER || 'Default' }}"
          echo "Client Key: ${{ env.CUSTOM_CLIENT_KEY != '' && '***' || 'Not set' }}"
          echo "============================"

      - name: Build RustDesk
        run: |
          export VCPKG_ROOT=$VCPKG_ROOT
          export CUSTOM_CLIENT_KEY="${{ env.CUSTOM_CLIENT_KEY }}"
          export CUSTOM_API_SERVER="${{ env.CUSTOM_API_SERVER }}"
          export CUSTOM_RELAY_SERVER="${{ env.CUSTOM_RELAY_SERVER }}"
          export CUSTOM_RENDEZVOUS_SERVER="${{ env.CUSTOM_RENDEZVOUS_SERVER }}"

          python3 build.py --flutter --release

      - name: Package Artifacts
        run: |
          mkdir -p artifacts

          # Copy Flutter build output
          if [ -d "flutter/build/macos/Build/Products/Release" ]; then
            cp -r flutter/build/macos/Build/Products/Release/*.app artifacts/ 2>/dev/null || true
          fi

          # Create config info
          cat > artifacts/config-info.txt << EOF
          Custom Server Configuration
          =========================
          Generated: $(date)
          Platform: macOS
          Rendezvous Server: ${{ env.CUSTOM_RENDEZVOUS_SERVER }}
          API Server: ${{ env.CUSTOM_API_SERVER || 'Default' }}
          Relay Server: ${{ env.CUSTOM_RELAY_SERVER || 'Default' }}
          Client Key: ${{ env.CUSTOM_CLIENT_KEY != '' && 'Configured' || 'Not set' }}
          EOF

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-custom-macos
          path: artifacts/
          retention-days: 30
